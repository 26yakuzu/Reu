[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terrasense"
version = "0.1.0"
description = "TerraSense Nigeria — research prototype for evidence-based environmental screening (Nigeria only)"
requires-python = ">=3.11"
license = "BSL-1.0"
dependencies = [
  "numpy>=2.0", "pandas>=2.2", "pyyaml>=6", "requests>=2.31",
  "shapely>=2.0", "pyproj>=3.6", "geopandas>=1.0", "pyogrio>=0.9", "pyarrow>=15",
  "rasterio>=1.4", "scikit-learn>=1.5", "joblib>=1.4", "openpyxl>=3.1",
  "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7", "python-multipart>=0.0.9",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "folium>=0.17", "streamlit-folium>=0.22", "pillow>=10"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realdata: needs files fetched into data/raw (skipped when absent)"]
