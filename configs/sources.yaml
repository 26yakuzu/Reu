sources:
  - id: s4a_field
    title: Soils4Africa — Field data from a continental soil survey campaign
    doi: 10.5281/zenodo.17699297
    publisher: Zenodo
    version: "1"
    published: 2026-06-26
    licence: CC-BY-4.0
    attribution: "Mesele, S., Huising, J., Csorba, A., et al. (2026). Soils4Africa field data. Zenodo. doi:10.5281/zenodo.17699297"
    kind: point_observations
    measured: true          # field description by surveyors (FAO guidelines), not lab
    role: [soil_context, surface_description]
    verified: true
    verified_on: 2026-11-27
    notes: >
      Zenodo record contains FIELD data only (15k+ sites, 33 countries). Publisher
      states quality control is ongoing. Laboratory results (texture, bulk density,
      OC, chemistry) are listed on africasis.isric.org/download.html but every
      download link on that page was a placeholder (href="#") when checked, so lab
      texture is NOT available to this project yet. Sampling targeted agricultural
      land monitoring; it is not representative of roads or construction sites.
    files:
      - {key: s4a_field_data.csv, url: "https://zenodo.org/api/records/17699297/files/s4a_field_data.csv/content", checksum: "md5:23416634c2a7ae89e715980f77021229", size: 7379850, fetch: true}
