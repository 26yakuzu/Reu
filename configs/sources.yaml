# TerraSense Nigeria — source registry
#
# Every entry records what was VERIFIED against the live repository metadata
# (see `verified` and `verified_on`) versus what is still UNKNOWN. Fields marked
# `claimed:` come from the project brief and have NOT been confirmed.
#
# `files[].checksum` values are copied from the repository API (Zenodo md5,
# Mendeley sha256). `scripts/fetch.py` refuses a file whose checksum differs.
# `fetch: false` means the file is not downloaded by default (too large for
# the MVP or not yet needed); pass --include-large to fetch it.

boundary:
