  - id: geotech_ibadan
    title: Soil geotechnical properties dataset for a tremor area of South-West Nigeria (Ibadan)
    doi: 10.17632/cts2jkgvrw.2
    publisher: Mendeley Data
    version: "2"
    published: 2023-05-30
    licence: CC-BY-4.0
    attribution: "Akanbi, O., Osueke, C., Adebayo, S. (2023). Mendeley Data, V2, doi:10.17632/cts2jkgvrw.2"
    kind: point_observations
    measured: true
    role: [geotechnical_context_only]
    verified: true
    verified_on: 2026-11-27
    notes: >
      Nine pit locations, 1.5-3.0 m depth, Ibadan, plus secondary construction
      investigation results. Variables include moisture, Atterberg limits, grain size,
      compaction (OMC/MDD), shear strength (cohesion, friction angle), consolidation,
      permeability. No CBR listed. n=9 cannot support model training; context only.
      No vehicle/crossing outcomes.
    files:
      - {key: geotech_ibadan.xlsx, url: "https://data.mendeley.com/public-files/datasets/cts2jkgvrw/files/1257a4ff-ee5e-42cb-8a2d-f61944afb06c/file_downloaded", checksum: "sha256:358d2c5c3708d489be60b17acc40de3d3bc3ee36d3cc82945909f6017ed18993", size: 19783, fetch: true}

