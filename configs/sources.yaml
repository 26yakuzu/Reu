  - id: ozoro_texture
    title: Soil characterization for texture and moisture properties ... Ozoro, Nigeria
    doi: 10.17632/ph9fx5bj9n.1
    publisher: Mendeley Data
    version: "1"
    published: 2025-05-21
    licence: CC-BY-4.0
    attribution: "Okolotu, G. I., Ozioko, C. F., Ofuyekpone, O. D., Oluka, I. (2025). Mendeley Data, V1, doi:10.17632/ph9fx5bj9n.1"
    kind: point_observations
    measured: true
    role: [soil_texture_target_candidate]
    verified: true
    verified_on: 2026-11-27
    notes: >
      Abstract: 750 samples, 0-10 cm, texture by JAR TECHNIQUE (sedimentation jar,
      a field method — less precise than hydrometer/pipette lab analysis), moisture
      by oven/microwave drying. The ONLY file is a .docx (434 kB). Whether it holds
      per-sample coordinates and sand/silt/clay percentages must be checked by
      scripts/audit.py; do not assume it does.
    files:
      - {key: ozoro.docx, url: "https://data.mendeley.com/public-files/datasets/ph9fx5bj9n/files/533161eb-658b-4deb-a015-4c2523de9e4e/file_downloaded", checksum: "sha256:d07d8d9b276a6788f00e2268ec13aa41e3801d3b77f473dfb7fb1ca120304f22", size: 434176, fetch: true}

